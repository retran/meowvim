name: Meowvim CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stylua
        run: |
          wget -qO stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip
          unzip -p stylua.zip stylua > stylua
          chmod +x stylua
          sudo mv stylua /usr/local/bin/

      - name: Check formatting
        run: stylua --check lua/ init.lua

  test:
    name: Test on ${{ matrix.os }} with Neovim ${{ matrix.nvim-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        nvim-version: [stable, nightly]
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim and search tools
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim-version }}

      - name: Install ripgrep and fd
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ripgrep fd-find
            mkdir -p "$HOME/.local/bin"
            ln -s "$(command -v fdfind)" "$HOME/.local/bin/fd"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            brew install ripgrep fd
          fi

      # The checkout is used in place: copying it would drop the dotfiles that
      # stylua and luacheck read.
      - name: Point Neovim at the checkout
        run: |
          mkdir -p "$HOME/.config"
          ln -s "$GITHUB_WORKSPACE" "$HOME/.config/nvim"

      # A plain table, which is what meowvim.config expects. No user config at
      # all would also work; this one pins the theme so the run is reproducible.
      - name: Write the user config
        run: |
          mkdir -p "$HOME/.config/meowvim"
          cat > "$HOME/.config/meowvim/config.lua" <<'LUA'
          return {
            core = { theme = "catppuccin", variant = "mocha", enable_copilot = false },
            editor = { tabstop = 2, indent = 2 },
            performance = { buffer_auto_close = false },
          }
          LUA

      - name: Install plugins
        run: nvim --headless "+Lazy! sync" +qa

      - name: Run the config tests
        run: bash bin/test-config.sh

      - name: Show the health report
        if: always()
        run: |
          nvim --headless "+checkhealth meowvim" "+write! /tmp/health.txt" +qa
          cat /tmp/health.txt
